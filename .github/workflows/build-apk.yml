name: Build Blender 5.2 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_blender.sh'
      - 'scripts/build_deps.sh'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git wget tar zip unzip openjdk-17-jdk meson pkg-config libeigen3-dev

      - name: Restore Android Dependencies Sysroot
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: sysroot-android-arm64
          key: ${{ runner.os }}-android-deps-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Build Dependencies if Not Cached
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_deps.sh
          ./scripts/build_deps.sh

      - name: Save Android Dependencies Sysroot Immediately
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sysroot-android-arm64
          key: ${{ runner.os }}-android-deps-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Build Blender 5.2 and Assemble APK
        run: |
          chmod +x scripts/build_blender.sh
          ./scripts/build_blender.sh

      - name: Upload Blender APK
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-Android-arm64-APK
          path: Blender-Android-arm64.apk
          retention-days: 30
