name: Build Blender 5.2 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_blender.sh'
      - 'scripts/build_deps.sh'
      - '.github/workflows/build-apk.yml'
      - 'bionic-arm64.tar.gz'
      - 'android/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-5]*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git wget tar zip unzip openjdk-17-jdk meson pkg-config libeigen3-dev build-essential libtbb-dev gcc-14 g++-14 clang-18 libjpeg-dev libpng-dev zlib1g-dev libzstd-dev libepoxy-dev libfmt-dev libfreetype6-dev libwebp-dev libtiff-dev libxml2-dev libopenimageio-dev libopenexr-dev libimath-dev libshaderc-dev qemu-user-static binfmt-support
          if [ -f bionic-arm64.tar.gz ]; then
            sudo tar -xzf bionic-arm64.tar.gz -C /
            sudo chmod -R 755 /system
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore Android Dependencies Sysroot
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: sysroot-android-arm64
          key: ${{ runner.os }}-android-deps-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Build Dependencies if Not Cached
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_deps.sh
          ./scripts/build_deps.sh

      - name: Save Android Dependencies Sysroot Immediately
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sysroot-android-arm64
          key: ${{ runner.os }}-android-deps-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Build Blender 5.2 and Assemble APK
        run: |
          chmod +x scripts/build_blender.sh
          ./scripts/build_blender.sh

      - name: Upload Blender APK
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-Android-arm64-APK
          path: Blender-Android-arm64.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v5.2.0-android-preview
          name: Blender 5.2 Android ARM64 Preview
          files: Blender-Android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
