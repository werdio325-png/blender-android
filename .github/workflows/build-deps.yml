name: Build Dependencies Sysroot (Android ARM64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_deps.sh'
      - '.github/workflows/build-deps.yml'

jobs:
  build-deps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git wget tar

      - name: Run Dependencies Build Script
        run: |
          chmod +x scripts/build_deps.sh
          ./scripts/build_deps.sh

      - name: Upload Sysroot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-deps-android-arm64
          path: blender-deps-android-arm64.tar.gz
          retention-days: 30
